# Baseline regression guard (T7.5): every part-2 module's settings, with every part-2
# module switched off (left out of `modules`). It must write daily.csv, yearly.csv and
# events.jsonl byte-identical to baseline.yaml; `make check` runs the comparison
# (cmd/silosim TestPart2OffEqualsBaseline).
# Each part-2 milestone adds its module's section here at a NON-null setting, so the
# guard catches any setting that acts while its module is off.
extends: baseline.yaml
name: part2-off

space:                    # M8, off; settings differ from the baseline's
  walkingHoursPerDay: 4
  officeFloors:
    it: [30]

network:                  # M9, off
  weakTiesPerKind: 2
  strongTieDailyChance: 0.9
  weakTieStrength: 0.9

beliefs:                  # M10, off
  taughtLegitimacy: 0.3
  educationWeight: 0.9
  legitimacyCostPerFlag: 0.5
  passChance: 0.5
  halfLifeHeardYears: 1
  halfLifeLivedYears: 2
  relics: 500
  relicHiddenYears: 1
  relicKeptYears: 1
  cueChance: 0.5
  flamekeeperSeats: 40
  doseHideChance: 0.5
  waterDosingDays: 30

control:                  # M11, off
  surveillance: 1
  arrestsPerOfficer: 1
  raidsPerYear: 365
  findChance: 1
  nameChance: 1
  minesFloor: 100
  cleaningFailChance: 1
  cleaningLift: 1
  liftHalfLifeYears: 10
  fearPerTrial: 1
  fearHalfLifeYears: 10
  implantDoctors: 50
  deniedTries: 1

pact:                     # M11, off: everything is a cleaning
  - id: everything
    active: true
    offences: [holdRelic, tradeRelic, speakForbidden, askToGoOut, unpermittedConception, contactAttempt, organise, violence, sabotage]
    detection: 1
    first: { cleaning: true, confiscate: true, flagFamily: true }
    enforcer: judicial
    visibility: 1

rebellion:                # M12, off
  lossHardship: 1
  lossHalfLifeYears: 10
  scapegoatHardship: 1
  activeThreshold: 0
  arrestConstant: 0.1
  violentThreshold: 0
  unrestShare: 0
  unrestDays: 1
  rebellionShare: 0
  rebellionDays: 1
  quietDays: 1
