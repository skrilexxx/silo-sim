# Baseline scenario: Silo 18 running normally under the Pact.
# This file is the COMPLETE default parameter set. Every number in ODD §7 is here.
# Other scenarios start with `extends: baseline.yaml` and override only what changes.
#   The path is relative to the child file. Sections merge key by key; lists
#   (modules, departments) replace the parent's list whole.
# Baseline v1 (tag baseline-v1). Values marked "calibrate" were checked in T6.1: only
#   kcalPerFarmUnit was changed; the others keep their defaults (docs/calibration-log.md).
# Units: probabilities and rates are per day unless the key says otherwise.

name: baseline
seed: 42
warmupYears: 50
years: 200
population: 10000                 # day-1 size (ODD §5)
modules: [demography, health, work, resources, governance]

output:
  dir: runs
  logWarmup: false
  invariantEvery: 365             # ticks between invariant checks in normal runs (tests: every tick)
  understaffedShare: 0.5          # events.jsonl logs a department below this share of its target (ODD §8)

init:                             # ODD §5
  floorsPerZone: 48               # 3 zones × 48 = 144 floors
  zoneSplit: { upTop: 0.32, mids: 0.46, downDeep: 0.22 }
  pairedMinAge: 20                # day-1 couples are formed from adults this age or older
  pairedShareOfAdults: 0.70       # adults 20+ living as couples on day 1
  homeCapacityMargin: 1.15        # homes per zone = 1.15 × households needed
  farmFloors: 20                  # spread evenly through the Mids
  mechanicalFloors: 12            # the lowest floors
  foodStockDays: 90
  partsStockDays: 365
  generatorCondition: 0.8

mortality:                        # ODD §6.1
  gompertzA: 0.0002               # per year
  gompertzB: 0.085                # per year; median death ≈ 67 at health 1
  infantHazard: 0.02              # extra yearly hazard in the first year of life
  healthMultiplier: 2.0           # k_h

health:                           # ODD §6.2
  hungerDamage: 0.02              # calibrate; per day at zero intake
  airDamage: 0.05                 # calibrate; per day at zero air
  injuryChance: 0.0002
  injuryFactor: { mechanical: 2.0, farms: 1.0, other: 0.5 }
  injuryCost: 0.3
  illnessChance: 0.0005
  illnessCost: 0.15
  recoveryRate: 0.01              # calibrate; per day at full Medical coverage
  maternalDeathBase: 0.002        # risk = base × (2 − medicalCoverage)

coverage:                         # ODD §6.6, shared by every department
  needFactor: 0.84                # calibrate; need = 0.84 × day-1 target headcount, so full staff gives ≈ 1.1

partnering:                       # ODD §6.3
  minAge: 18
  searchRate: 0.0009              # calibrate; ≈ one search every 3 years
  sameZoneWeight: 4.0
  sameDepartmentWeight: 2.0
  sameSexWeight: 0.05             # calibrate; ≈ 5% of new couples are same-sex
  ageGapScaleYears: 5.0

lottery:                          # ODD §6.4
  targetPopulation: 10000
  maxPermitsPerMonth: 40
  openWindowWeight: 0.8           # E = pregnant + 0.8 × open windows
  windowDays: 365
  conceptionChance: 0.0044        # ≈ 80% within a 365-day window
  pregnancyDays: 270
  motherAgeMin: 18
  motherAgeMax: 40
  maxChildren: 3
  minYoungestAgeYears: 2
  girlShare: 0.5                  # chance a newborn is a girl

work:                             # ODD §6.5
  shadowAge: 14
  workerAge: 18
  retireAge: 65
  sickLeaveDays: 90               # a worker this many days in a row below sickLeaveHealth goes on sick leave
  sickLeaveHealth: 0.3            # ...and returns to work once health is back at this level
  followParentChance: 0.6
  crossZoneChance: 0.05
  maxShadowsPerMaster: 2
  masterMinSkill: 0.5
  skillGrowth: 0.00044            # skill += α × (1 − skill) per working day
  shadowOutputFactor: 0.3
  retrainBelowShare: 0.8          # of target headcount
  retrainStartSkill: 0.2
  # People in "all zones" departments are spread so the total split matches init.zoneSplit.
  allZoneSplit: { upTop: 0.36, mids: 0.40, downDeep: 0.24 }
  departments:                    # order is fixed and used as the department index
    - { name: farms,          zone: mids,     share: 0.30 }
    - { name: general,        zone: all,      share: 0.20 }   # cafeterias, crafts, cleaning
    - { name: mechanical,     zone: downDeep, share: 0.16 }   # includes the water plant
    - { name: supply,         zone: mids,     share: 0.06 }
    - { name: judicial,       zone: upTop,    share: 0.06 }   # includes Security
    - { name: porters,        zone: all,      share: 0.05 }
    - { name: education,      zone: upTop,    share: 0.05 }
    - { name: medical,        zone: upTop,    share: 0.04 }
    - { name: it,             zone: upTop,    share: 0.04 }
    - { name: administration, zone: upTop,    share: 0.03 }   # Mayor's office
    - { name: sheriff,        zone: upTop,    share: 0.01 }

resources:                        # ODD §6.6
  generatorWear: 0.0004           # calibrate
  repairRate: 0.002               # ρ; condition settles at 1 − wear/ρ = 0.8 at full coverage
  failureBase: 0.002              # calibrate; f₀ × (1 − c)² ≈ 3 failures per century at c = 0.8
  outageMinDays: 3                # repair days with perfect Mechanical skill and full parts
  outageMaxDays: 10               # cap; outage = min(10, ⌈3 / (skill × partsShare)⌉)
  failureConditionDrop: 0.1
  backupPower: 0.173              # share of capacity; 0.173 × 1.5 ≈ 26% of day-1 demand, as before capacity went to 1.5
  capacityMargin: 1.5             # capacity = 1.5 × day-1 demand: full power even after a failure (c ≈ 0.7)
  powerDemandPerPerson: 1.0       # abstract units
  powerDemandPerFarmFloor: 150.0
  airRecoveryShare: 0.333         # air moves this share of the gap toward powerFactor each day
  kcalPerFarmUnit: 11900          # calibrated (calibration log, 2026-10-29): ≈ 5% food surplus
  partsPerDayFullCoverage: 1.2    # Supply production at coverage 1
  partsPerRepairDay: 1.0
  partsPerFailure: 30.0

rations:                          # ODD §6.7
  adultKcal: 2200
  childAgeBelow: 14
  childNeedShare: 0.6
  rationingBelowDays: 30
  rationingShare: 0.9
  weights: { upTop: 1.0, mids: 1.0, downDeep: 1.0 }   # policy lever; 1.0 everywhere = equal

governance:                       # ODD §6.8
  mode: appointment               # or: election
  term: 5y                        # or: life
  ownZoneVote: 0.8
