# Baseline scenario: Silo 18 running normally under the Pact.
# This file is the COMPLETE default parameter set. Every number in ODD §7 is here.
# Other scenarios start with `extends: baseline.yaml` and override only what changes.
#   The path is relative to the child file. Sections merge key by key; lists
#   (modules, departments) replace the parent's list whole.
# Baseline v1 (tag baseline-v1). Values marked "calibrate" were checked in T6.1: only
#   kcalPerFarmUnit was changed; the others keep their defaults (docs/calibration-log.md).
# Units: probabilities and rates are per day unless the key says otherwise.

name: baseline
seed: 42
warmupYears: 50
years: 200
population: 10000                 # day-1 size (ODD §5)
modules: [demography, health, work, resources, governance]
# events: scripted shocks (ODD §5), none in the baseline. Each is { day: <run day in the
#   measured years>, type: <a type defined by a module that is on> }, e.g. { day: 20000, type: cleaningFailure }.

output:
  dir: runs
  logWarmup: false
  invariantEvery: 365             # ticks between invariant checks in normal runs (tests: every tick)
  frames: false                   # frames.csv.gz, per-floor snapshots for replay viewers (ODD §1.2, §8)
  frameEvery: 30                  # days between frames, when frames is on
  understaffedShare: 0.5          # events.jsonl logs a department below this share of its target (ODD §8)
  runAfterCollapse: false         # part 2: keep running after a collapse, to extinction or the last day (ODD §1.2)

init:                             # ODD §5
  floorsPerZone: 48               # 3 zones × 48 = 144 floors
  zoneSplit: { upTop: 0.32, mids: 0.46, downDeep: 0.22 }
  pairedMinAge: 20                # day-1 couples are formed from adults this age or older
  pairedShareOfAdults: 0.70       # adults 20+ living as couples on day 1
  homeCapacityMargin: 1.15        # homes per zone = 1.15 × households needed
  farmFloors: 20                  # spread evenly through the Mids
  mechanicalFloors: 12            # the lowest floors
  foodStockDays: 90
  partsStockDays: 365
  generatorCondition: 0.8

mortality:                        # ODD §6.1
  gompertzA: 0.0002               # per year
  gompertzB: 0.085                # per year; median death ≈ 67 at health 1
  infantHazard: 0.02              # extra yearly hazard in the first year of life
  healthMultiplier: 2.0           # k_h

health:                           # ODD §6.2
  hungerDamage: 0.02              # calibrate; per day at zero intake
  airDamage: 0.05                 # calibrate; per day at zero air
  injuryChance: 0.0002
  injuryFactor: { mechanical: 2.0, farms: 1.0, other: 0.5 }
  injuryCost: 0.3
  illnessChance: 0.0005
  illnessCost: 0.15
  recoveryRate: 0.01              # calibrate; per day at full Medical coverage
  maternalDeathBase: 0.002        # risk = base × (2 − medicalCoverage)

coverage:                         # ODD §6.6, shared by every department
  needFactor: 0.84                # calibrate; need = 0.84 × day-1 target headcount, so full staff gives ≈ 1.1

partnering:                       # ODD §6.3
  minAge: 18
  searchRate: 0.0009              # calibrate; ≈ one search every 3 years
  sameZoneWeight: 4.0
  sameDepartmentWeight: 2.0
  sameSexWeight: 0.05             # calibrate; ≈ 5% of new couples are same-sex
  ageGapScaleYears: 5.0

lottery:                          # ODD §6.4
  targetPopulation: 10000
  maxPermitsPerMonth: 40
  openWindowWeight: 0.8           # E = pregnant + 0.8 × open windows
  windowDays: 365
  conceptionChance: 0.0044        # ≈ 80% within a 365-day window
  pregnancyDays: 270
  motherAgeMin: 18
  motherAgeMax: 40
  maxChildren: 3
  minYoungestAgeYears: 2
  girlShare: 0.5                  # chance a newborn is a girl

work:                             # ODD §6.5
  shadowAge: 14
  workerAge: 18
  retireAge: 65
  sickLeaveDays: 90               # a worker this many days in a row below sickLeaveHealth goes on sick leave
  sickLeaveHealth: 0.3            # ...and returns to work once health is back at this level
  followParentChance: 0.6
  crossZoneChance: 0.05
  maxShadowsPerMaster: 2
  masterMinSkill: 0.5
  skillGrowth: 0.00044            # skill += α × (1 − skill) per working day
  shadowOutputFactor: 0.3
  retrainBelowShare: 0.8          # of target headcount
  retrainStartSkill: 0.2
  # People in "all zones" departments are spread so the total split matches init.zoneSplit.
  allZoneSplit: { upTop: 0.36, mids: 0.40, downDeep: 0.24 }
  departments:                    # order is fixed and used as the department index
    - { name: farms,          zone: mids,     share: 0.30 }
    - { name: general,        zone: all,      share: 0.20 }   # cafeterias, crafts, cleaning
    - { name: mechanical,     zone: downDeep, share: 0.16 }   # includes the water plant
    - { name: supply,         zone: mids,     share: 0.06 }
    - { name: judicial,       zone: upTop,    share: 0.06 }   # includes Security
    - { name: porters,        zone: all,      share: 0.05 }
    - { name: education,      zone: upTop,    share: 0.05 }
    - { name: medical,        zone: upTop,    share: 0.04 }
    - { name: it,             zone: upTop,    share: 0.04 }
    - { name: administration, zone: upTop,    share: 0.03 }   # Mayor's office
    - { name: sheriff,        zone: upTop,    share: 0.01 }

resources:                        # ODD §6.6
  generatorWear: 0.0004           # calibrate
  repairRate: 0.002               # ρ; condition settles at 1 − wear/ρ = 0.8 at full coverage
  failureBase: 0.002              # calibrate; f₀ × (1 − c)² ≈ 3 failures per century at c = 0.8
  outageMinDays: 3                # repair days with perfect Mechanical skill and full parts
  outageMaxDays: 10               # cap; outage = min(10, ⌈3 / (skill × partsShare)⌉)
  failureConditionDrop: 0.1
  backupPower: 0.173              # share of capacity; 0.173 × 1.5 ≈ 26% of day-1 demand, as before capacity went to 1.5
  capacityMargin: 1.5             # capacity = 1.5 × day-1 demand: full power even after a failure (c ≈ 0.7)
  powerDemandPerPerson: 1.0       # abstract units
  powerDemandPerFarmFloor: 150.0
  airRecoveryShare: 0.333         # air moves this share of the gap toward powerFactor each day
  kcalPerFarmUnit: 11900          # calibrated (calibration log, 2026-10-29): ≈ 5% food surplus
  partsPerDayFullCoverage: 1.2    # Supply production at coverage 1
  partsPerRepairDay: 1.0
  partsPerFailure: 30.0

rations:                          # ODD §6.7
  adultKcal: 2200
  childAgeBelow: 14
  childNeedShare: 0.6
  rationingBelowDays: 30
  rationingShare: 0.9
  weights: { upTop: 1.0, mids: 1.0, downDeep: 1.0 }   # policy lever; 1.0 everywhere = equal

space:                            # ODD §6.10 (part 2, draft); used only when `space` is in modules
  fullDescentHours: 12            # hours of walking from floor 1 to 144; guess (2 days at 8 h a day)
  walkingHoursPerDay: 8           # guess
  officeFloors:                   # residential floors in the department's zone; guesses
    administration: [1]           # the Mayor's office, near the cafeteria
    sheriff: [1]
    judicial: [2, 3]
    medical: [12]
    education: [20]
    it: [33, 34]
    supply: [72]                  # Mids

network:                          # ODD §6.11 (part 2, draft); used only when `network` is in modules
  weakTiesPerKind: 5              # k: coworker, neighbour and porter ties per person, each; guess
  strongTieDailyChance: 0.5       # p_s: chance a strong tie is used on a day; a weak one w_weak × p_s; guess
  weakTieStrength: 0.3            # w_weak: a weak tie is used w_weak times as often as a strong one; guess

beliefs:                          # ODD §6.12 (part 2, draft); used only when `beliefs` is in modules
  taughtLegitimacy: 0.8           # L_edu: the legitimacy Education teaches; everyone's base on day 1; guess
  educationWeight: 0.5            # ε: Education's share of a young person's base, the rest from parents (and master); guess
  legitimacyCostPerFlag: 0.15     # δ: legitimacy lost per known flag; guess
  passChance: 0.002               # π: chance a flag passes in a conversation, × (1 − L of the listener); guess, calibrated against C4 in T12.8
  halfLifeHeardYears: 5           # T_heard: half of what was heard is forgotten in this time; guess
  halfLifeLivedYears: 20          # T_lived: the same for what was lived (seen, found, kept); guess
  relics: 100                     # N_relic: relics hidden on day 1, each on a random floor; guess
  relicHiddenYears: 50            # T_find: years a hidden relic stays hidden on average; guess
  relicKeptYears: 10              # T_keep: years a holder keeps a relic before handing it on, on average; guess
  cueChance: 0.05                 # κ: chance a cue (a day holding a relic) works; guess
  flamekeeperSeats: 15            # N_F: seats of the Flamekeepers, all filled on day 1; guess ("a small secret group")
  doseHideChance: 0.01            # d: daily chance a known flag is hidden while on Vitamin D+; guess (a year hides 97%)
  waterDosingDays: 365            # D_water: days the scripted event waterDosing lasts; guess

control:                          # ODD §6.13 (part 2, draft); used only when `control` is in modules
  surveillance: 0.05              # σ: chance an act is seen at full IT coverage and detection weight 1; guess, checked against 0–2 cleanings a year in T12.8
  arrestsPerOfficer: 0.05         # a: arrests a day per Judicial or Sheriff worker; guess
  raidsPerYear: 4                 # R_raid: Judicial raids on a floor, searching every flat; guess
  findChance: 0.2                 # p_find: a search finds a held relic; guess (relics are hidden well)
  nameChance: 0.3                 # p_name: an arrested Flamekeeper names one other member, drawn uniformly; guess
  minesFloor: 144                 # where mines sentences are served; lore: the mines lie at the bottom [Likely]
  cleaningFailChance: 0.05        # p_fail: a cleaner refuses and walks out of sight; guess
  cleaningLift: 0.05              # λ: lift of everyone's L from a cleaning seen by all (× the rule's visibility); guess
  liftHalfLifeYears: 1            # T_S: the lift halves in this time; guess
  fearPerTrial: 0.01              # φ: fear added by a trial seen by all (× the rule's visibility); guess
  fearHalfLifeYears: 1            # T_F: fear halves in this time; guess
  implantDoctors: 2               # N_doc: Medical workers who do every implant removal; show ("one or two doctors")
  deniedTries: 3                  # N_try: denied lottery wins before a flagged couple stops entering; guess (Adam: 3–4)

# The Pact (ODD §6.9): the canon rule table; used only when `control` is in modules.
# A penalty maps prison and mines (days) and cleaning, confiscate, flagFamily (true); {} is
# a warning. repeat, if left out, is the same as first. Weights, penalties and visibilities
# are guesses, for the sensitivity analysis (T15.3).
pact:
  - id: noRelics                  # owning or trading objects from before the silo
    active: true
    offences: [holdRelic, tradeRelic]
    detection: 1.0
    first:  { confiscate: true, prison: 90 }
    repeat: { confiscate: true, prison: 365 }
    enforcer: judicial
    visibility: 0.5
  - id: noForbiddenTalk           # speaking about the outside, the time before, or other silos
    active: true
    offences: [speakForbidden]
    detection: 0.5
    first:  {}                    # a warning
    repeat: { prison: 180, flagFamily: true }  # and the couple quietly flagged; on the first offence it flagged 51% of the silo in 56 years (T11.3)
    enforcer: judicial
    visibility: 0.3
  - id: goingOut                  # saying "I want to go out"
    active: true
    offences: [askToGoOut]
    detection: 1.0
    first:  { cleaning: true }
    enforcer: sheriff
    visibility: 1.0
  - id: lottery                   # conceiving without a permit or removing one's own implant
    active: true
    offences: [unpermittedConception]
    detection: 0.8
    first:  { prison: 180, flagFamily: true }
    repeat: { cleaning: true }
    enforcer: judicial
    visibility: 0.6
  - id: noContact                 # radio contact, digging toward other silos, opening the doors below
    active: true
    offences: [contactAttempt]
    detection: 0.7
    first:  { cleaning: true }
    enforcer: judicial
    visibility: 0.2
  - id: noViolence                # attacking officers or damaging the silo's systems
    active: true
    offences: [violence, sabotage]
    detection: 1.0
    first:  { mines: 730 }
    repeat: { cleaning: true }
    enforcer: judicial
    visibility: 0.8
  - id: noOrganising              # unauthorised gatherings and strikes
    active: true
    offences: [organise]
    detection: 0.6
    first:  { prison: 90 }
    repeat: { mines: 365 }
    enforcer: judicial
    visibility: 0.7

rebellion:                        # ODD §6.14 (part 2, draft); used only when `rebellion` is in modules
  lossHardship: 0.5               # ℓ: hardship from a loss in the family (a relative cleaned, a denied lottery win), on its day; guess
  lossHalfLifeYears: 2            # T_loss: the loss's hardship halves in this time; guess
  scapegoatHardship: 0.2          # s_DD: hardship of living Down Deep; guess (lore: Mechanical is blamed when trouble rises, S2)
  activeThreshold: 0.1            # T: active when G − R × felt risk > T; Epstein (2002)
  arrestConstant: 2.3             # k: P = 0.9 when the patrol equals the actives plus one; Epstein (2002)
  violentThreshold: 0.3           # T_v: a joined adult is violent when G − R × felt risk > T_v; guess
  strikeShare: 0.1                # q_strike: a critical department is on strike when this share of its workers strike (§1.2); guess
  officerEffect: 0.05             # e_J: rebels put out a day per officer in a fight (Lanchester's square law); guess
  rebelEffect: 0.01               # e_R: officers put out a day per violent rebel in a fight; guess (a patrol beats √(e_J/e_R) ≈ 2.2× its number)
  killedShare: 0.3                # p_kill: share of those put out who die; the rest are arrested (rebels) or wounded (officers); guess
  sabotageChance: 0.001           # p_sab: daily chance a violent rebel sabotages the generator, the pump or the stairs; guess
  stairRepairDays: 60             # D_stair: mean days to repair a broken segment at full Mechanical coverage; guess
  pointOfNoReturn: 0              # P_min (§1.2): collapse below this population; 0 = off until measured (T12.6)
  unrestShare: 0.01               # unrest: at least this share of adults active ... (ODD §1.2, decision D1)
  unrestDays: 3                   # ... on this many days in a row
  rebellionShare: 0.05            # rebellion: at least this share of adults active ...
  rebellionDays: 7                # ... on this many days in a row, with a collective action on one of them
  quietDays: 30                   # unrest and a rebellion end after this many days in a row below unrestShare
  regimeDays: 30                  # regime change: rebels hold Up Top this many days in a row (§1.2, decision D1)
  collapseLevel: 0.2              # collapse: air or water below this level ... (§1.2, decision D2)
  collapseDays: 30                # ... for this many days in a row

governance:                       # ODD §6.8
  mode: appointment               # or: election
  term: 5y                        # or: life
  ownZoneVote: 0.8
